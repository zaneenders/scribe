openapi: 3.1.0
info:
  title: Scribe Daemon API
  version: 1.0.0
  description: Local API shared by the Scribe daemon and its clients.
servers:
  - url: http://127.0.0.1
paths:
  /v1/health:
    get:
      operationId: getHealth
      summary: Inspect daemon health and protocol compatibility
      responses:
        "200":
          description: The daemon is ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /v1/profiles:
    get:
      operationId: listProfiles
      summary: List server-side agent profiles available to new and existing sessions
      responses:
        "200":
          description: Profile metadata with no credentials or other secrets.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileList"
  /v1/sessions:
    get:
      operationId: listSessions
      summary: List session summaries
      responses:
        "200":
          description: Sessions ordered by most recent activity.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionList"
    post:
      operationId: createSession
      summary: Create and open a new session
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionRequest"
      responses:
        "201":
          description: The new authoritative session snapshot.
          headers:
            Location:
              description: URL of the newly created session.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionSnapshot"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: The idempotency key was reused with a different request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
  /v1/sessions/{sessionID}:
    parameters:
      - $ref: "#/components/parameters/SessionID"
    get:
      operationId: getSession
      summary: Fetch a session and its newest transcript page
      responses:
        "200":
          description: >-
            An authoritative session snapshot. The transcript includes any partial
            assistant output currently being generated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionSnapshot"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateSession
      summary: Rename or pin a session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSessionRequest"
      responses:
        "200":
          description: The updated authoritative session snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionSnapshot"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/RevisionConflict"
  /v1/sessions/{sessionID}/messages:
    parameters:
      - $ref: "#/components/parameters/SessionID"
    get:
      operationId: listSessionMessages
      summary: Fetch one cursor-paginated transcript page
      parameters:
        - name: before
          in: query
          required: false
          description: Opaque cursor identifying the first currently loaded entry.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Maximum number of logical transcript entries to return.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: Entries immediately before the cursor, ordered oldest to newest.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscriptPage"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: submitSessionMessage
      summary: Submit or enqueue a user message
      description: >-
        Auto mode starts immediately when idle and otherwise appends to the session
        queue. Use Idempotency-Key to retry without submitting the message twice.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitMessageRequest"
      responses:
        "202":
          description: The message was accepted for immediate or queued execution.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandAccepted"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/RevisionConflict"
  /v1/sessions/{sessionID}/interrupt:
    parameters:
      - $ref: "#/components/parameters/SessionID"
    post:
      operationId: interruptSession
      summary: Interrupt the active turn while preserving queued messages
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: The interrupt was accepted; completion is reported by session events.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandAccepted"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/sessions/{sessionID}/queue:
    parameters:
      - $ref: "#/components/parameters/SessionID"
    delete:
      operationId: clearSessionQueue
      summary: Remove all queued messages without interrupting the active turn
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: The updated queue state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionQueue"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/sessions/{sessionID}/queue/send-next:
    parameters:
      - $ref: "#/components/parameters/SessionID"
    post:
      operationId: sendNextQueuedMessage
      summary: Interrupt if necessary and run the next queued message
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: The force-send command was accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandAccepted"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The session queue is empty.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
  /v1/sessions/{sessionID}/fork:
    parameters:
      - $ref: "#/components/parameters/SessionID"
    post:
      operationId: forkSession
      summary: Create a session from an advertised safe transcript boundary
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForkSessionRequest"
      responses:
        "201":
          description: The new forked session snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionSnapshot"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/RevisionConflict"
        "422":
          $ref: "#/components/responses/InvalidBoundary"
  /v1/sessions/{sessionID}/tldr:
    parameters:
      - $ref: "#/components/parameters/SessionID"
    post:
      operationId: summarizeSessionRange
      summary: Create a fork with a safe transcript range replaced by a summary
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TLDRSessionRequest"
      responses:
        "202":
          description: The asynchronous TLDR command was accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandAccepted"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/RevisionConflict"
        "422":
          $ref: "#/components/responses/InvalidBoundary"
  /v1/sessions/{sessionID}/profile:
    parameters:
      - $ref: "#/components/parameters/SessionID"
    put:
      operationId: setSessionProfile
      summary: Reconfigure an idle session with a server-side profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetSessionProfileRequest"
      responses:
        "200":
          description: The reconfigured authoritative session snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionSnapshot"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/RevisionConflict"
  /v1/sessions/{sessionID}/open:
    parameters:
      - $ref: "#/components/parameters/SessionID"
    delete:
      operationId: releaseSession
      summary: Release this client's interest in a live session
      description: Does not delete persisted history or interrupt active work.
      responses:
        "204":
          description: Client interest was released.
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/filesystem:
    get:
      operationId: getFilesystem
      summary: Inspect the server filesystem roots and default working directory
      responses:
        "200":
          description: Filesystem metadata used to initialize the remote directory picker.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FilesystemInfo"
  /v1/filesystem/directories:
    get:
      operationId: listDirectories
      summary: List one page of child directories on the server
      description: >-
        Lists direct children only; this operation never recursively walks the
        server filesystem. Paths are interpreted by the server. When parent is
        omitted, the configured default directory is used. A cursor is bound to
        the parent, prefix, hidden-file setting, and sort order of the first page.
      parameters:
        - name: parent
          in: query
          required: false
          description: Absolute server directory to browse; defaults to defaultDirectory.
          schema:
            type: string
        - name: prefix
          in: query
          required: false
          description: Return child directory names beginning with this prefix.
          schema:
            type: string
        - name: cursor
          in: query
          required: false
          description: Opaque continuation cursor returned by the previous page.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: includeHidden
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: A name-sorted page of direct child directories.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DirectoryPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/FilesystemForbidden"
        "404":
          $ref: "#/components/responses/DirectoryNotFound"
        "410":
          $ref: "#/components/responses/CursorExpired"
  /v1/filesystem/resolve-directory:
    post:
      operationId: resolveDirectory
      summary: Resolve and validate a server directory path
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResolveDirectoryRequest"
      responses:
        "200":
          description: The canonical server directory.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResolvedDirectory"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/FilesystemForbidden"
        "404":
          $ref: "#/components/responses/DirectoryNotFound"
  /v1/filesystem/complete-directory:
    post:
      operationId: completeDirectory
      summary: Complete a directory path using the server filesystem
      description: >-
        Applies server path syntax, home-directory expansion, and filesystem
        visibility. The result is advisory; createSession validates the selected
        working directory again.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteDirectoryRequest"
      responses:
        "200":
          description: A completed input and a bounded set of matching directory names.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DirectoryCompletion"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/FilesystemForbidden"
  /v1/filesystem/recent-directories:
    get:
      operationId: listRecentDirectories
      summary: List server directories recently used by sessions
      parameters:
        - name: cursor
          in: query
          required: false
          description: Opaque continuation cursor returned by the previous page.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: Existing accessible directories ordered by most recent use.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecentDirectoryPage"
        "410":
          $ref: "#/components/responses/CursorExpired"
  /v1/events:
    get:
      operationId: streamEvents
      summary: Stream lightweight session-list events
      description: >-
        Opens a long-lived Server-Sent Events stream for global session summary
        changes. Detailed transcript events use the per-session stream.
      parameters:
        - $ref: "#/components/parameters/LastEventID"
      responses:
        "200":
          description: >-
            Each SSE data field contains one JSON-encoded GlobalEventEnvelope.
            The SSE id field is the decimal eventID.
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/GlobalEventEnvelope"
        "409":
          $ref: "#/components/responses/ResyncRequired"
  /v1/sessions/{sessionID}/events:
    parameters:
      - $ref: "#/components/parameters/SessionID"
    get:
      operationId: streamSessionEvents
      summary: Stream detailed live events for one displayed session
      description: >-
        Opens a long-lived Server-Sent Events stream containing token deltas, tool
        activity, usage, and turn completion. Use afterRevision when subscribing
        from a snapshot, or Last-Event-ID when reconnecting an interrupted stream.
      parameters:
        - name: afterRevision
          in: query
          required: false
          schema:
            type: integer
            format: int64
            minimum: 0
        - $ref: "#/components/parameters/LastEventID"
      responses:
        "200":
          description: >-
            Each SSE data field contains one JSON-encoded SessionEventEnvelope.
            The SSE id field is the decimal eventID.
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/SessionEventEnvelope"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/ResyncRequired"
components:
  parameters:
    SessionID:
      name: sessionID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    LastEventID:
      name: Last-Event-ID
      in: header
      required: false
      description: Last completely applied SSE event ID when reconnecting.
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: >-
        Unique client-generated key used to safely retry a mutating command after
        a connection failure without applying it twice.
      schema:
        type: string
        minLength: 1
        maxLength: 200
  responses:
    BadRequest:
      description: The request is invalid or the working directory cannot be used.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIError"
    NotFound:
      description: The requested session does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIError"
    ResyncRequired:
      description: Replay is unavailable; fetch a fresh authoritative snapshot.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ResyncRequired"
    DirectoryNotFound:
      description: The server path does not exist or is not a directory.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIError"
    FilesystemForbidden:
      description: The directory is outside the server's allowed roots or is not accessible.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIError"
    CursorExpired:
      description: The opaque pagination cursor is invalid or no longer usable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIError"
    RevisionConflict:
      description: The session changed since the client obtained its snapshot.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIError"
    InvalidBoundary:
      description: A fork or TLDR boundary is stale, unknown, or would split a tool round.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIError"
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status, protocolVersion, daemonInstanceID, capabilities]
      properties:
        status:
          type: string
          enum: [ok]
        protocolVersion:
          type: integer
          minimum: 1
        daemonInstanceID:
          type: string
          format: uuid
        capabilities:
          type: array
          items:
            $ref: "#/components/schemas/Capability"
    Capability:
      type: string
      enum: [sessions, streaming, filesystemBrowsing, managedTerminals, shellTools, fileTools, computerUse]
    SessionList:
      type: object
      additionalProperties: false
      required: [sessions]
      properties:
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/SessionSummary"
    CreateSessionRequest:
      type: object
      additionalProperties: false
      properties:
        workingDirectory:
          type: string
          minLength: 1
          description: >-
            Server directory in which to run the agent. The daemon resolves and
            validates it when creating the session. Omit it to use defaultDirectory.
        profileName:
          type: string
          description: Profile to use; omit to use the configured default profile.
        initialMessage:
          type: string
          minLength: 1
          description: >-
            Optional first user message. When provided, creation returns after the
            message is accepted and its output is delivered on the session event stream.
    FilesystemInfo:
      type: object
      additionalProperties: false
      required: [defaultDirectory, homeDirectory, allowedRoots, caseSensitive]
      properties:
        defaultDirectory:
          type: string
          description: Canonical server directory used when createSession omits workingDirectory.
        homeDirectory:
          type: string
          description: Server home directory used when expanding a leading tilde.
        allowedRoots:
          type: array
          description: Roots the authenticated client is permitted to browse and use.
          items:
            $ref: "#/components/schemas/FilesystemRoot"
        caseSensitive:
          type: boolean
          description: Whether server path and prefix comparisons are case-sensitive.
    FilesystemRoot:
      type: object
      additionalProperties: false
      required: [path, displayName]
      properties:
        path:
          type: string
        displayName:
          type: string
    DirectoryEntry:
      type: object
      additionalProperties: false
      required: [name, path, readable]
      properties:
        name:
          type: string
          description: Basename suitable for display in a directory browser.
        path:
          type: string
          description: Canonical absolute path on the server.
        readable:
          type: boolean
          description: Whether the daemon can enumerate this directory.
    DirectoryPage:
      type: object
      additionalProperties: false
      required: [parent, directories, hasMore]
      properties:
        parent:
          $ref: "#/components/schemas/DirectoryEntry"
        directories:
          type: array
          items:
            $ref: "#/components/schemas/DirectoryEntry"
        nextCursor:
          type: string
          description: Opaque continuation cursor; present only when hasMore is true.
        hasMore:
          type: boolean
    ResolveDirectoryRequest:
      type: object
      additionalProperties: false
      required: [path]
      properties:
        path:
          type: string
          minLength: 1
          description: Absolute, relative, or tilde-prefixed path using server path syntax.
        relativeTo:
          type: string
          description: Canonical server directory for relative paths; defaults to defaultDirectory.
    ResolvedDirectory:
      type: object
      additionalProperties: false
      required: [path, displayPath]
      properties:
        path:
          type: string
          description: Canonical absolute directory path on the server.
        displayPath:
          type: string
          description: A server-produced compact path suitable for display.
    CompleteDirectoryRequest:
      type: object
      additionalProperties: false
      required: [input]
      properties:
        input:
          type: string
          description: Partial path using server path syntax.
        relativeTo:
          type: string
          description: Canonical server directory for relative input; defaults to defaultDirectory.
        includeHidden:
          type: boolean
          default: false
        limit:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
    DirectoryCompletion:
      type: object
      additionalProperties: false
      required: [completedInput, matches, hasMoreMatches]
      properties:
        completedInput:
          type: string
          description: Input extended to the longest unambiguous server-side completion.
        resolvedParent:
          type: string
          description: Canonical server directory that was searched, when resolvable.
        matches:
          type: array
          description: Bounded, name-sorted matching child directory names.
          items:
            type: string
        hasMoreMatches:
          type: boolean
          description: True when matching names were omitted because the limit was reached.
    RecentDirectory:
      type: object
      additionalProperties: false
      required: [directory, lastUsedAt]
      properties:
        directory:
          $ref: "#/components/schemas/DirectoryEntry"
        lastUsedAt:
          type: string
          format: date-time
    RecentDirectoryPage:
      type: object
      additionalProperties: false
      required: [directories, hasMore]
      properties:
        directories:
          type: array
          items:
            $ref: "#/components/schemas/RecentDirectory"
        nextCursor:
          type: string
          description: Opaque continuation cursor; present only when hasMore is true.
        hasMore:
          type: boolean
    ProfileList:
      type: object
      additionalProperties: false
      required: [profiles, defaultProfileName]
      properties:
        profiles:
          type: array
          items:
            $ref: "#/components/schemas/ProfileSummary"
        defaultProfileName:
          type: string
    ProfileSummary:
      type: object
      additionalProperties: false
      required: [name, modelName]
      properties:
        name:
          type: string
        modelName:
          type: string
    UpdateSessionRequest:
      type: object
      additionalProperties: false
      required: [expectedRevision]
      properties:
        expectedRevision:
          type: integer
          format: int64
          minimum: 0
        title:
          type: string
        pinned:
          type: boolean
    SubmitMessageRequest:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
        mode:
          type: string
          enum: [auto, enqueue]
          default: auto
        expectedRevision:
          type: integer
          format: int64
          minimum: 0
    CommandAccepted:
      type: object
      additionalProperties: false
      required: [commandID, sessionID, sessionRevision]
      properties:
        commandID:
          type: string
          format: uuid
        sessionID:
          type: string
          format: uuid
        sessionRevision:
          type: integer
          format: int64
          minimum: 0
    QueuedMessage:
      type: object
      additionalProperties: false
      required: [id, text]
      properties:
        id:
          type: string
          format: uuid
        text:
          type: string
    SessionQueue:
      type: object
      additionalProperties: false
      required: [messages]
      properties:
        messages:
          type: array
          items:
            $ref: "#/components/schemas/QueuedMessage"
    TranscriptBoundary:
      type: object
      additionalProperties: false
      required: [id, afterEntryID]
      properties:
        id:
          type: string
          description: Opaque revision-bound token accepted by fork and TLDR commands.
        afterEntryID:
          type: string
          description: Transcript entry after which this safe boundary occurs.
    ForkSessionRequest:
      type: object
      additionalProperties: false
      required: [boundaryID, expectedRevision]
      properties:
        boundaryID:
          type: string
        expectedRevision:
          type: integer
          format: int64
          minimum: 0
    TLDRSessionRequest:
      type: object
      additionalProperties: false
      required: [startBoundaryID, endBoundaryID, expectedRevision]
      properties:
        startBoundaryID:
          type: string
        endBoundaryID:
          type: string
        expectedRevision:
          type: integer
          format: int64
          minimum: 0
    SetSessionProfileRequest:
      type: object
      additionalProperties: false
      required: [profileName, expectedRevision]
      properties:
        profileName:
          type: string
          minLength: 1
        expectedRevision:
          type: integer
          format: int64
          minimum: 0
    SessionSummary:
      type: object
      additionalProperties: false
      required: [id, workingDirectory, profileName, modelName, state, pinned, lastMessageAt]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        workingDirectory:
          type: string
        profileName:
          type: string
        modelName:
          type: string
        state:
          $ref: "#/components/schemas/SessionState"
        pinned:
          type: boolean
        lastMessageAt:
          type: string
          format: date-time
    SessionState:
      type: string
      enum: [idle, running, interrupted, failed]
    SessionSnapshot:
      type: object
      additionalProperties: false
      required: [summary, sessionRevision, transcript, queue, safeBoundaries]
      properties:
        summary:
          $ref: "#/components/schemas/SessionSummary"
        sessionRevision:
          type: integer
          format: int64
          minimum: 0
        transcript:
          $ref: "#/components/schemas/TranscriptPage"
        queue:
          $ref: "#/components/schemas/SessionQueue"
        safeBoundaries:
          type: array
          description: Revision-bound positions currently valid for fork and TLDR commands.
          items:
            $ref: "#/components/schemas/TranscriptBoundary"
        activeTurnID:
          type: string
          format: uuid
    TranscriptPage:
      type: object
      additionalProperties: false
      required: [entries, hasMoreBefore, sessionRevision]
      properties:
        entries:
          type: array
          description: Logical entries ordered oldest to newest.
          items:
            $ref: "#/components/schemas/TranscriptEntry"
        oldestCursor:
          type: string
          description: Opaque cursor to pass as before when loading older entries.
        hasMoreBefore:
          type: boolean
        sessionRevision:
          type: integer
          format: int64
          minimum: 0
    TranscriptEntry:
      oneOf:
        - $ref: "#/components/schemas/UserMessageEntry"
        - $ref: "#/components/schemas/AssistantMessageEntry"
        - $ref: "#/components/schemas/ToolEntry"
        - $ref: "#/components/schemas/NoticeEntry"
      discriminator:
        propertyName: type
        mapping:
          userMessage: "#/components/schemas/UserMessageEntry"
          assistantMessage: "#/components/schemas/AssistantMessageEntry"
          tool: "#/components/schemas/ToolEntry"
          notice: "#/components/schemas/NoticeEntry"
    UserMessageEntry:
      type: object
      additionalProperties: false
      required: [type, id, text]
      properties:
        type:
          type: string
          enum: [userMessage]
        id:
          type: string
        text:
          type: string
    AssistantMessageEntry:
      type: object
      additionalProperties: false
      required: [type, id, sections, streaming]
      properties:
        type:
          type: string
          enum: [assistantMessage]
        id:
          type: string
        sections:
          type: array
          items:
            $ref: "#/components/schemas/AssistantSectionDTO"
        streaming:
          type: boolean
    AssistantSectionDTO:
      type: object
      additionalProperties: false
      required: [id, kind, text]
      properties:
        id:
          type: string
        kind:
          $ref: "#/components/schemas/AssistantSection"
        text:
          type: string
    ToolEntry:
      type: object
      additionalProperties: false
      required: [type, id, toolCallID, name, status]
      properties:
        type:
          type: string
          enum: [tool]
        id:
          type: string
        toolCallID:
          type: string
        name:
          type: string
        arguments:
          type: string
        output:
          type: string
        status:
          $ref: "#/components/schemas/ToolStatus"
    NoticeEntry:
      type: object
      additionalProperties: false
      required: [type, id, level, text]
      properties:
        type:
          type: string
          enum: [notice]
        id:
          type: string
        level:
          type: string
          enum: [info, warning, error]
        text:
          type: string
    GlobalEventEnvelope:
      type: object
      additionalProperties: false
      required: [protocolVersion, eventID, payload]
      properties:
        protocolVersion:
          type: integer
          minimum: 1
        eventID:
          type: integer
          format: int64
          minimum: 0
        payload:
          $ref: "#/components/schemas/GlobalEvent"
    GlobalEvent:
      oneOf:
        - $ref: "#/components/schemas/SessionSummaryChangedEvent"
        - $ref: "#/components/schemas/SessionRemovedEvent"
        - $ref: "#/components/schemas/GlobalResyncRequiredEvent"
      discriminator:
        propertyName: type
        mapping:
          sessionSummaryChanged: "#/components/schemas/SessionSummaryChangedEvent"
          sessionRemoved: "#/components/schemas/SessionRemovedEvent"
          resyncRequired: "#/components/schemas/GlobalResyncRequiredEvent"
    SessionSummaryChangedEvent:
      type: object
      additionalProperties: false
      required: [type, summary]
      properties:
        type:
          type: string
          enum: [sessionSummaryChanged]
        summary:
          $ref: "#/components/schemas/SessionSummary"
    SessionRemovedEvent:
      type: object
      additionalProperties: false
      required: [type, sessionID]
      properties:
        type:
          type: string
          enum: [sessionRemoved]
        sessionID:
          type: string
          format: uuid
    GlobalResyncRequiredEvent:
      type: object
      additionalProperties: false
      required: [type, reason]
      properties:
        type:
          type: string
          enum: [resyncRequired]
        reason:
          type: string
    SessionEventEnvelope:
      type: object
      additionalProperties: false
      required: [protocolVersion, eventID, sessionID, sessionRevision, payload]
      properties:
        protocolVersion:
          type: integer
          minimum: 1
        eventID:
          type: integer
          format: int64
          minimum: 0
        sessionID:
          type: string
          format: uuid
        sessionRevision:
          type: integer
          format: int64
          minimum: 0
        turnID:
          type: string
          format: uuid
        payload:
          $ref: "#/components/schemas/SessionEvent"
    SessionEvent:
      oneOf:
        - $ref: "#/components/schemas/UserMessageAppendedEvent"
        - $ref: "#/components/schemas/AssistantSectionStartedEvent"
        - $ref: "#/components/schemas/AssistantTextDeltaEvent"
        - $ref: "#/components/schemas/ToolStartedEvent"
        - $ref: "#/components/schemas/ToolFinishedEvent"
        - $ref: "#/components/schemas/UsageUpdatedEvent"
        - $ref: "#/components/schemas/TurnFinishedEvent"
        - $ref: "#/components/schemas/SessionResyncRequiredEvent"
      discriminator:
        propertyName: type
        mapping:
          userMessageAppended: "#/components/schemas/UserMessageAppendedEvent"
          assistantSectionStarted: "#/components/schemas/AssistantSectionStartedEvent"
          assistantTextDelta: "#/components/schemas/AssistantTextDeltaEvent"
          toolStarted: "#/components/schemas/ToolStartedEvent"
          toolFinished: "#/components/schemas/ToolFinishedEvent"
          usageUpdated: "#/components/schemas/UsageUpdatedEvent"
          turnFinished: "#/components/schemas/TurnFinishedEvent"
          resyncRequired: "#/components/schemas/SessionResyncRequiredEvent"
    UserMessageAppendedEvent:
      type: object
      additionalProperties: false
      required: [type, entry]
      properties:
        type:
          type: string
          enum: [userMessageAppended]
        entry:
          $ref: "#/components/schemas/UserMessageEntry"
    AssistantSectionStartedEvent:
      type: object
      additionalProperties: false
      required: [type, entryID, section]
      properties:
        type:
          type: string
          enum: [assistantSectionStarted]
        entryID:
          type: string
        section:
          $ref: "#/components/schemas/AssistantSectionDTO"
    AssistantTextDeltaEvent:
      type: object
      additionalProperties: false
      required: [type, entryID, sectionID, text]
      properties:
        type:
          type: string
          enum: [assistantTextDelta]
        entryID:
          type: string
        sectionID:
          type: string
        text:
          type: string
    AssistantSection:
      type: string
      enum: [reasoning, answer]
    ToolStartedEvent:
      type: object
      additionalProperties: false
      required: [type, entry]
      properties:
        type:
          type: string
          enum: [toolStarted]
        entry:
          $ref: "#/components/schemas/ToolEntry"
    ToolFinishedEvent:
      type: object
      additionalProperties: false
      required: [type, entryID, status]
      properties:
        type:
          type: string
          enum: [toolFinished]
        entryID:
          type: string
        status:
          $ref: "#/components/schemas/ToolStatus"
        output:
          type: string
    ToolStatus:
      type: string
      enum: [running, succeeded, failed, interrupted]
    UsageUpdatedEvent:
      type: object
      additionalProperties: false
      required: [type, inputTokens, outputTokens]
      properties:
        type:
          type: string
          enum: [usageUpdated]
        inputTokens:
          type: integer
          format: int64
          minimum: 0
        outputTokens:
          type: integer
          format: int64
          minimum: 0
    TurnFinishedEvent:
      type: object
      additionalProperties: false
      required: [type, outcome]
      properties:
        type:
          type: string
          enum: [turnFinished]
        outcome:
          type: string
          enum: [completed, failed, interrupted]
        errorMessage:
          type: string
    SessionResyncRequiredEvent:
      type: object
      additionalProperties: false
      required: [type, reason]
      properties:
        type:
          type: string
          enum: [resyncRequired]
        reason:
          type: string
    ResyncRequired:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
    APIError:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
