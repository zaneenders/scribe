name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GHOSTTY_NETWORK_PERMISSION: --allow-network-connections all:443

jobs:
  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-24.04
    container: swift:latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check repository hygiene
        env:
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$EVENT_BASE_SHA" ] && git cat-file -e "$EVENT_BASE_SHA^{commit}" 2>/dev/null; then
            base_sha=$EVENT_BASE_SHA
          else
            base_sha=$(git rev-parse HEAD^)
          fi
          git diff --check "$base_sha" "$GITHUB_SHA"
          git diff --name-only --diff-filter=ACMR "$base_sha" "$GITHUB_SHA" -- '*.swift' |
            while IFS= read -r swift_file; do
              case "$swift_file" in
                Vendor/GhosttySource/*) continue ;;
              esac
              swift format lint --strict "$swift_file"
            done

  macos:
    name: macOS
    needs: hygiene
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Show Swift version
        run: swift --version
      - name: Cache Swift package dependencies
        uses: actions/cache@v6
        with:
          path: |
            .build/checkouts
            .build/repositories
          key: swiftpm-dependencies-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Package.resolved') }}
      - name: Read Ghostty revision
        id: ghostty-source
        run: echo "revision=$(git -C Vendor/GhosttySource rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Cache Ghostty terminal library
        id: cache-ghostty
        uses: actions/cache@v6
        with:
          path: |
            Vendor/GhosttyVt/Libraries
            Vendor/GhosttyVt/Headers/ghostty
            Vendor/GhosttyVt/PROVENANCE.md
          key: ghostty-vt-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.ghostty-source.outputs.revision }}-${{ hashFiles('Plugins/GhosttyVtRefreshPlugin/plugin.swift', 'Scripts/bootstrap-zig.sh') }}
      - name: Cache Zig
        if: steps.cache-ghostty.outputs.cache-hit != 'true'
        uses: actions/cache@v6
        with:
          path: Vendor/.tools
          key: zig-0.16.0-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Scripts/bootstrap-zig.sh') }}
      - name: Build Ghostty terminal library
        if: steps.cache-ghostty.outputs.cache-hit != 'true'
        run: |
          ./Scripts/bootstrap-zig.sh
          swift package \
            --allow-writing-to-package-directory \
            $GHOSTTY_NETWORK_PERMISSION \
            refresh-ghostty-vt
      - name: Build
        run: swift build
      - name: Test
        run: swift test

  arch:
    name: Arch Linux / Omarchy
    needs: hygiene
    # GitHub does not provide an Arch-hosted runner. This VM only runs the
    # container; every project command below runs in Arch Linux.
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      SWIFTLY_HOME_DIR: /github/home/.local/share/swiftly
      SWIFTLY_BIN_DIR: /github/home/.local/bin
    steps:
      # Scribe needs a recursive submodule checkout; Chroma does not. Install
      # Git first so checkout does not fall back to the REST archive path.
      - name: Install Git for checkout
        run: pacman -Sy --noconfirm git
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Install Swift and native development libraries
        run: |
          pacman -Syu --noconfirm \
            binutils \
            ca-certificates \
            clang \
            cmake \
            curl \
            file \
            git \
            gnupg \
            gzip \
            icu \
            libbsd \
            libedit \
            libxkbcommon \
            libxml2 \
            libxml2-legacy \
            mesa \
            ncurses \
            ninja \
            openssl \
            pkgconf \
            python \
            sqlite \
            tar \
            unzip \
            wayland \
            wayland-protocols \
            xz \
            z3 \
            zlib
          ln -sf /usr/lib/libncursesw.so.6 /usr/lib/libncurses.so.6
          curl -fsSL https://download.swift.org/swiftly/linux/swiftly-x86_64.tar.gz \
            -o /tmp/swiftly.tar.gz
          tar -xzf /tmp/swiftly.tar.gz -C /tmp
          /tmp/swiftly init \
            --platform ubuntu24.04 \
            --skip-install \
            --no-modify-profile \
            --assume-yes \
            --quiet-shell-followup
          "$SWIFTLY_BIN_DIR/swiftly" install --use 6.3 --assume-yes || true
          toolchain_path=$("$SWIFTLY_BIN_DIR/swiftly" use --print-location)
          "$toolchain_path/usr/bin/swift" --version
          echo "$toolchain_path/usr/bin" >> "$GITHUB_PATH"
      - name: Show Swift version
        run: swift --version
      - name: Trust checkout ownership
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Cache Swift package dependencies
        uses: actions/cache@v6
        with:
          path: |
            .build/checkouts
            .build/repositories
          key: swiftpm-dependencies-arch-x86_64-${{ hashFiles('Package.resolved') }}
      - name: Read Ghostty revision
        id: ghostty-source
        run: echo "revision=$(git -C Vendor/GhosttySource rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Cache Ghostty terminal library
        id: cache-ghostty
        uses: actions/cache@v6
        with:
          path: |
            Vendor/GhosttyVt/Libraries
            Vendor/GhosttyVt/Headers/ghostty
            Vendor/GhosttyVt/PROVENANCE.md
          key: ghostty-vt-v1-arch-x86_64-${{ steps.ghostty-source.outputs.revision }}-${{ hashFiles('Plugins/GhosttyVtRefreshPlugin/plugin.swift', 'Scripts/bootstrap-zig.sh') }}
      - name: Cache Zig
        if: steps.cache-ghostty.outputs.cache-hit != 'true'
        uses: actions/cache@v6
        with:
          path: Vendor/.tools
          key: zig-0.16.0-arch-x86_64-${{ hashFiles('Scripts/bootstrap-zig.sh') }}
      - name: Build Ghostty terminal library
        if: steps.cache-ghostty.outputs.cache-hit != 'true'
        run: |
          ./Scripts/bootstrap-zig.sh
          swift package \
            --allow-writing-to-package-directory \
            $GHOSTTY_NETWORK_PERMISSION \
            refresh-ghostty-vt
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Build release archive
        if: startsWith(github.ref, 'refs/tags/v')
        run: ./Scripts/package-linux.sh
      - name: Inspect release archive
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tar -tzf dist/scribe-linux-x86_64-*.tar.gz
          sha256sum --check dist/scribe-linux-x86_64-*.tar.gz.sha256
      - name: Upload Arch Linux package
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: scribe-archlinux-x86_64
          path: |
            dist/scribe-linux-x86_64-*.tar.gz
            dist/scribe-linux-x86_64-*.tar.gz.sha256
          if-no-files-found: error
      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/scribe-linux-x86_64-*.tar.gz
            dist/scribe-linux-x86_64-*.tar.gz.sha256
          generate_release_notes: true
